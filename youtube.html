
<!DOCTYPE html>
<html>
  <head>
    <title> YouTube.com Clone </title>
    
    <style>
      .search_bar {
        display: block;
        font-size: 10px;
        margin-left: 0px;
      }

      .video_preview {
        display: inline-block;
        width: 276px;
        vertical-align: top;
        margin-right: 15px;
      }
      .thumbnail{     
        display: block;
        width: 276px;
      }
      .thumbnail_div{
        margin-bottom: 12px;
      }

      .profile_pic_div{
        display: inline-block;
        width: 50px; 
        vertical-align: top;
      }

      .profile_pic_setting{
        display: inline-block;
        width: 40px; 
        border-radius: 50px;

      }

      .video_description_div{
        display: inline-block;
      }

      .video_title{
        font-size: 14px;
        font-family: Arial;
        margin-top: 0px;
      }
    </style>
  </head>

  <body>
    <input class="search_bar" type="text" placeholder="Search">

    <div class="video_preview"> 
      <div class="thumbnail_div"> <!-- video thumbnail H-->
        <img class="thumbnail" src="Thumbnails/advice.avif"> 
      </div> 

      <div> <!-- video description V: Profile pic + Texts -->
        <div class="profile_pic_div"> 
          <img class="profile_pic_setting" src="Profile Pictures/Lassie.jpg">
        </div> 

        <div class="video_description_div">
          <p class="video_title"> LET THEM - JUST LET THEM </p>
          <p class="video_author"> 4.9M views &#183; 1 year ago</p>
          <p class="video_stats"> Looking at Life with Dee </p>
        </div>
      </div> 

    </div>

    <div class="video_preview"> 
      <img class="thumbnail" src="Thumbnails/hqdefault (1).webp">

      <p class="video_title"> i'm in a weird mood lol </p>
      <p class="video_author"> 1.2M views &#183; 5 months ago</p>
      <p class="video_stats"> emma chamberlain </p>
    </div>

  </body>
</html>
